<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivicQuest | Citizen Tech Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="src/styles/reporting.css">
</head>
<body>
  <div class="app">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <a class="logo" href="#/home" data-route="home"><b>✦</b>Civic<span>Quest</span></a>
      
      <small class="section-label">MAIN MENU</small>
      <nav>
        <button class="nav-item active" data-route="home">▦ <span>Overview</span></button>
        <button class="nav-item" data-route="report">＋ <span>Report Issue</span></button>
        <button class="nav-item" data-route="missions">◒ <span>Missions</span><i>3</i></button>
        <button class="nav-item" data-route="leaderboard">♧ <span>Community</span></button>
      </nav>

      <small class="section-label">YOUR IMPACT & REWARDS</small>
      <nav>
        <button class="nav-item" data-route="wallet">♢ <span>Impact Wallet</span></button>
        <button class="nav-item" data-route="wallet">✧ <span>Badges</span></button>
      </nav>

      <!-- Neighborhood Crew Box -->
      <div class="crew">
        <div class="faces"><b>AR</b><b>JM</b><b>SK</b><i>+12</i></div>
        <strong>Maplewood crew</strong>
        <small>Ranked #2 this week</small>
        <div class="meter"><i></i></div>
        <small>1,280 / 1,500 pts to #1</small>
      </div>

      <nav class="bottom">
        <button class="nav-item" data-route="home">⚙ <span>Settings</span></button>
      </nav>

      <!-- User Profile Box -->
      <div class="profile" id="sidebar-profile">
        <b>AS</b>
        <span>
          <strong id="sidebar-user-name">Alex Stone</strong>
          <small id="sidebar-user-badge">Level 7 · Civic Champion</small>
        </span>
        •••
      </div>
    </aside>

    <!-- Main Application Viewport -->
    <main>
      <header>
        <div class="mobile-logo" data-route="home">✦ Civic<span>Quest</span></div>
        <div class="place">
          ⌖ <span><small>YOUR NEIGHBORHOOD</small><strong>Vellore, Tamil Nadu ⌄</strong></span>
        </div>
        <button class="btn btn-primary" data-route="report" style="padding: 8px 16px; font-size: 11px;">
          ＋ Report Issue <kbd>R</kbd>
        </button>
        <div class="top-avatar" title="Alex Stone - Level 7 Civic Champion">AS</div>
      </header>

      <!-- Dynamic View Container managed by router -->
      <div id="view-container"></div>
    </main>
  </div>

  <!-- Toast Notification Shell -->
  <div class="toast" id="toast">
    ✦ <span><b id="toast-title">Nice work!</b><small id="toast-desc">You earned 10 Civic Coins.</small></span>
  </div>

  <!-- Application Entry Point -->
  <script type="module" src="app.js"></script>
</body>
</html>
